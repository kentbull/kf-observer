# pyproject.toml

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kf-observer"
version = "0.0.1"
description = "KERI Foundation observer service for verified V2 ACDC TEL queries"
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }

authors = [
    { name = "KERI Foundation" },
]

keywords = ["keri-foundation", "cryptography", "KERI", "ACDC"]

classifiers = [
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

dependencies = [
    "hio>=0.7.19",
    "keri @ git+https://github.com/kentbull/keripy.git@a4d1e92a6da07a597034ff28e1f063cf6fabf10f",
    "multicommand>=1.0.0",
    "falcon>=4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.11.0,<0.16",
]

[project.scripts]
kf-observer = "kfobserver.app.cli.kfobserver:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["kfobserver*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
